<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato - Food delivery at your doorstep</title>
    <style>
        /* General Styling */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #fff5f5;
    color: #333;
}

/* Header */
header {
    background-color: #e23744;
    color: white;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header div:first-child {
    font-size: 32px;
    font-weight: bold;
}

header a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 17px;
}

header a:hover {
    text-decoration: underline;
}

/* Main Section */
main {
    min-height: 75vh;
    padding: 100px 8%;
    background: linear-gradient(
        135deg,
        #e23744,
        #ff6b6b
    );
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

main div {
    font-size: 48px;
    font-weight: bold;
    margin-bottom: 30px;
}

main p {
    font-size: 21px;
    line-height: 1.8;
    max-width: 750px;
}

/* Footer */
footer {
    background-color: #222;
    color: white;
    text-align: center;
    padding: 25px;
    font-size: 15px;
}

/* Responsive Design */
@media (max-width: 600px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    header a {
        margin: 0 8px;
        font-size: 15px;
    }

    main {
        padding: 70px 20px;
    }

    main div {
        font-size: 32px;
    }

    main p {
        font-size: 17px;
    }
}
    </style>
</head>
<body>
    <header>
        <div>Zomato</div>
        <div>
            <a href="/home">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </div>
    </header>

    <main>
        <div>
            Order food anytime, anyhere
        </div>
        <p>Better food for
more people
For over a decade,
 we’ve enabled our customers to discover new tastes, delivered right to their doorstep</p>
    </main>

    <footer>
        Copyright Zomato All rights reserved

    </footer>
    
</body>
</html>
